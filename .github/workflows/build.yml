name: Build and Test (with PIT guard)

on:
  push:
  pull_request:

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Build le module 'core' et ses dépendances, compiler tests
      - name: Build core and compile tests
        run: |
          mvn -B -pl core -am clean test-compile

  pit-verify:
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify classes exist
        run: |
          echo "Classes in core:"
          ls -R core/target/classes
          echo "Test classes in core:"
          ls -R core/target/test-classes

      # Run PIT sur core en ciblant toutes les classes et tous les tests
      - name: Run PIT on core
        run: |
          mkdir -p core/target/pit-reports
          mvn -B -pl core \
            -DargLine="-XX:+EnableDynamicAgentLoading" \
            -DreportsDirectory=core/target/pit-reports \
            -DtimeoutFactor=2.0 \
            -Dthreads=1 \
            -Dverbose=true \
            -DtargetClasses=com.graphhopper.util.* \
            -DtargetTests=com.graphhopper.util.* \
            -Dmutators=ALL \
            -DfailWhenNoMutations=false \
            -DoutputFormats=CSV,HTML \
            org.pitest:pitest-maven:mutationCoverage

      - name: Compute current PIT score
        run: |
          set -e
          mkdir -p pit-current
          
          REPORT_DIR=$(find core/target/pit-reports -type f -name "mutations.csv" | head -n 1)
          if [ ! -f "$REPORT_DIR" ]; then
            echo "::notice::mutations.csv not found. No mutants generated."
            echo "TOTAL=0" > pit-current/pit-score.txt
            echo "KILLED=0" >> pit-current/pit-score.txt
            echo "LINE_COVERAGE=0.00" >> pit-current/pit-score.txt
            cat pit-current/pit-score.txt
            exit 0
          fi

          cp "$REPORT_DIR" pit-current/mutations.csv
          TOTAL=$(tail -n +2 pit-current/mutations.csv | wc -l | tr -d ' ')
          KILLED=$(grep -c ',KILLED,' pit-current/mutations.csv || true)

          echo "TOTAL=$TOTAL" > pit-current/pit-score.txt
          echo "KILLED=$KILLED" >> pit-current/pit-score.txt
          if [ "$TOTAL" -gt 0 ]; then
            awk -v k="$KILLED" -v t="$TOTAL" 'BEGIN{printf("LINE_COVERAGE=%.2f\n",(k/t)*100)}' >> pit-current/pit-score.txt
          else
            echo "LINE_COVERAGE=0.00" >> pit-current/pit-score.txt
          fi
          cat pit-current/pit-score.txt

      - name: Download previous PIT artifact
        id: dl
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          name: pit-latest
          path: pit-previous
          branch: ${{ github.ref_name }}
          workflow_conclusion: success
          if_no_artifact_found: ignore

      - name: Compare current vs previous (fail on regression)
        run: |
          set -e
          if [ ! -f pit-previous/pit-score.txt ]; then
            echo "::notice::No previous PIT baseline found -> skipping regression check."
            exit 0
          fi

          CUR=$(grep LINE_COVERAGE pit-current/pit-score.txt  | cut -d= -f2)
          PREV=$(grep LINE_COVERAGE pit-previous/pit-score.txt | cut -d= -f2)

          echo "Previous: ${PREV}%"
          echo "Current : ${CUR}%"

          awk -v cur="$CUR" -v prev="$PREV" 'BEGIN{
            if (cur+0.0001 < prev) {
              printf("Mutation score regressed: current %.2f < previous %.2f\n", cur, prev);
              exit 1
            } else {
              printf(" OK: current %.2f >= previous %.2f\n", cur, prev);
              exit 0
            }
          }'

      - name: Upload current PIT artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-latest
          path: pit-current/*
