name: Build and Mutation Test

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test ${{ matrix.java-version }}
        run: mvn -B clean test

      - name: Run PIT mutation tests on DistanceCalcEuclidean
        run: |
          mvn org.pitest:pitest-maven:mutationCoverage \
            -DtargetClasses=com.graphhopper.util.DistanceCalcEuclidean \
            -DtargetTests=com.graphhopper.util.DistanceCalcEuclideanTest \
            -DoutputFormats=XML

      - name: Check mutation score
        run: |
          echo "Checking mutation score for DistanceCalcEuclidean..."
          SCORE=$(xmllint --xpath "string(//mutationStatistics/percentageCovered)" target/pit-reports/*/mutations.xml)
          echo "Mutation score: $SCORE%"
          THRESHOLD=80.0
          awk -v s="$SCORE" -v t="$THRESHOLD" 'BEGIN {exit (s < t) ? 1 : 0}'
