name: Build and Test

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Build and test ${{ matrix.java-version }}
        run: mvn -B clean test

      - name: Run PIT mutation tests
        run: mvn org.pitest:pitest-maven:mutationCoverage

      - name: Check mutation score
        run: |
          echo "Checking mutation score..."
          SCORE=$(xmllint --xpath "string(//mutationStatistics/percentageCovered)" target/pit-reports/*/mutations.xml)
          echo "Mutation score: $SCORE%"
          THRESHOLD=80.0
          awk -v s="$SCORE" -v t="$THRESHOLD" 'BEGIN {exit (s < t) ? 1 : 0}'
