name: Build and Test with Mutation Testing

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [24, 25-ea]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important pour avoir l'historique des commits

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Build and Test
        run: mvn -B clean test

      - name: Run Mutation Tests and Compare
        run: |
          # Installer PIT si nécessaire et exécuter les tests de mutation
          mvn org.pitest:pitest-maven:mutationCoverage -DoutputFormats=XML,HTML
          
          # Extraire le score de mutation actuel
          CURRENT_SCORE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('target/pit-reports/mutations.xml')
          root = tree.getroot()
          mutation_score = float(root.get('mutationCoverage') or root.get('mutation_coverage') or 0)
          print(f'{mutation_score:.2f}')
          ")
          
          echo "Current mutation score: $CURRENT_SCORE%"
          
          # Récupérer le score de référence (branche main ou précédent commit)
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            git fetch origin main
            git checkout origin/main
          
            # Exécuter PIT sur la branche de référence
            mvn org.pitest:pitest-maven:mutationCoverage -DoutputFormats=XML,HTML -DskipTests
          
            REFERENCE_SCORE=$(python -c "
            import xml.etree.ElementTree as ET
            tree = ET.parse('target/pit-reports/mutations.xml')
            root = tree.getroot()
            mutation_score = float(root.get('mutationCoverage') or root.get('mutation_coverage') or 0)
            print(f'{mutation_score:.2f}')
            ")
          
            echo "Reference mutation score: $REFERENCE_SCORE%"
          
            # Revenir à la branche actuelle
            git checkout ${{ github.sha }}
          
            # Comparer les scores
            if (( $(echo "$CURRENT_SCORE < $REFERENCE_SCORE" | bc -l) )); then
              echo " Mutation score decreased from $REFERENCE_SCORE% to $CURRENT_SCORE%"
              exit 1
            else
              echo " Mutation score maintained or improved: $REFERENCE_SCORE% → $CURRENT_SCORE%"
            fi
          else
            echo "Running on main branch or first commit - no reference comparison"
          fi
