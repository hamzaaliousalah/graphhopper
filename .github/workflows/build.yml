name: Build and Test

on:
  push:
  pull_request:
  issues:
    types: [opened]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

  pit-verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Download the artefact
        id: download_artefact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          workflow_conclusion: success
          name: pit-score
          path: mutation-previous/
        continue-on-error: true

      - name: Run PIT mutation tests
        run: |
          mvn -B -pl core test
          mvn -B -pl core \
            -DargLine="-XX:+EnableDynamicAgentLoading" \
            -DwithHistory \
            -DreportsDirectory=core/target/pit-reports \
            -DtimeoutFactor=2.0 \
            -Dthreads=1 \
            -Dverbose=true \
            -DtargetClasses=com.graphhopper.util.DistanceCalcEuclidean \
            -DtargetTests=com.graphhopper.util.DistanceCalcEuclideanTest \
            -Dmutators=ALL \
            -DfailWhenNoMutations=true \
            -DoutputFormats=CSV,HTML \
            org.pitest:pitest-maven:mutationCoverage

      - name: Compute mutation score from mutations.csv
        run: |
          set -e
          mkdir -p .mutation-current
          FILE=$(find core -name "mutations.csv" | head -n 1)
          echo "Found mutations.csv at: $FILE"
          if [ ! -f "$FILE" ]; then
            echo "::warning::mutations.csv not found"
            echo "MUTATION_SCORE=0.00" > .mutation-current/.mutation-score.txt
            exit 0
          fi
          cp "$FILE" .mutation-current/mutations.csv
          TESTED=$(grep -vc ',NO_COVERAGE,' .mutation-current/mutations.csv)
          KILLED=$(grep -c ',KILLED,' .mutation-current/mutations.csv)
          echo "TESTED=$TESTED"
          echo "KILLED=$KILLED"
          awk -v k="$KILLED" -v t="$TESTED" 'BEGIN{printf("MUTATION_SCORE=%.2f\n",(k/t)*100)}' > .mutation-current/.mutation-score.txt
          cat .mutation-current/.mutation-score.txt

      - name: Compare mutation score with previous
        run: |
          NEW_SCORE=$(grep MUTATION_SCORE .mutation-current/.mutation-score.txt | cut -d '=' -f 2)
          mkdir -p mutation-previous
          if [ -f mutation-previous/previous-score.txt ]; then
            OLD_SCORE=$(grep MUTATION_SCORE mutation-previous/previous-score.txt | cut -d '=' -f 2)
            echo "Previous score: $OLD_SCORE%"
            echo "Current score:  $NEW_SCORE%"
          else
            echo "::warning::No previous score found. Skipping comparison."
            OLD_SCORE=0
          fi
          if (( $(echo "$NEW_SCORE < $OLD_SCORE" | bc -l) )); then
            echo "::error::Mutation score dropped from $OLD_SCORE% to $NEW_SCORE%"
            exit 1
          fi
          echo "MUTATION_SCORE=$NEW_SCORE" > ./previous-score.txt

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: pit-score
          path: ./previous-score.txt

