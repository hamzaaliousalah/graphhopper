name: Mutation Test for DistanceCalcEuclidean

on: push

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 24, 25-ea ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Build only core module
        run: mvn -pl core -am clean install

      - name: Run PIT on DistanceCalcEuclidean
        run: |
          mvn -pl core org.pitest:pitest-maven:mutationCoverage \
            -DtargetClasses=com.graphhopper.util.DistanceCalcEuclidean \
            -DtargetTests=com.graphhopper.util.DistanceCalcEuclideanTest \
            -DoutputFormats=XML

      - name: Check mutation score
        run: |
          echo "Checking mutation score for DistanceCalcEuclidean..."
          SCORE=$(xmllint --xpath "string(//mutationStatistics/percentageCovered)" core/target/pit-reports/*/mutations.xml)
          echo "Mutation score: $SCORE%"
          THRESHOLD=80.0
          awk -v s="$SCORE" -v t="$THRESHOLD" 'BEGIN {exit (s < t) ? 1 : 0}'

