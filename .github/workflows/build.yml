name: Build and Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build core module
        run: mvn -B -pl core -am clean install -DskipTests

      - name: Run PIT mutation tests
        run: |
          mvn -B -pl core test
          mvn -B -pl core \
            -DargLine="-XX:+EnableDynamicAgentLoading" \
            -DwithHistory \
            -DreportsDirectory=core/target/pit-reports \
            -DtimeoutFactor=2.0 \
            -Dthreads=1 \
            -Dverbose=true \
            -DtargetClasses=com.graphhopper.util.DistanceCalcEuclidean \
            -DtargetTests=com.graphhopper.util.DistanceCalcEuclideanTest \
            -Dmutators=ALL \
            -DfailWhenNoMutations=true \
            -DoutputFormats=CSV,HTML,XML \
            org.pitest:pitest-maven:mutationCoverage

      - name: Extract current PIT score
        id: current
        run: |
          SCORE=$(grep -oPm1 "(?<=<score>)[^<]+" core/target/pit-reports/*/mutation.xml || echo 0)
          echo "current_score=$SCORE" >> $GITHUB_OUTPUT
          echo "Current mutation score: $SCORE"

      - name: Get previous PIT score
        id: previous
        run: |
          if [ -f mutation_score.txt ]; then
            PREV=$(cat mutation_score.txt)
          else
            PREV=0
          fi
          echo "previous_score=$PREV" >> $GITHUB_OUTPUT
          echo "Previous mutation score: $PREV"

      - name: Compare scores
        run: |
          CUR=${{ steps.current.outputs.current_score }}
          PREV=${{ steps.previous.outputs.previous_score }}

          echo "🔍 Comparing mutation scores..."
          echo "Previous: $PREV"
          echo "Current:  $CUR"

          if [ "$CUR" -lt "$PREV" ]; then
            echo "::error::Mutation score decreased! ($CUR < $PREV)"
            exit 1
          fi

          echo "Mutation score OK or improved ($CUR ≥ $PREV)"

      - name: Save new mutation score
        if: success()
        run: echo "${{ steps.current.outputs.current_score }}" > mutation_score.txt

      - name: Upload PIT report
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: core/target/pit-reports/**
