name: Build and Test (with PIT)

on:
  push:
  pull_request:

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build core module
        run: |
          mvn -B -pl core -am clean install -DskipTests

      - name: List compiled classes
        run: |
          echo "Classes in core module:"
          find core/target/classes -name "*.class"
          echo "Test classes in core module:"
          find core/target/test-classes -name "*.class"

  pit-verify:
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Download previous mutation score
        uses: actions/download-artifact@v4
        with:
          name: pit-score
          path: pit-previous
        continue-on-error: true

      - name: Run PIT mutation tests
        run: |
          mvn -B -pl core test
          mvn -B -pl core \
            -DargLine="-XX:+EnableDynamicAgentLoading" \
            -DwithHistory \
            -DreportsDirectory=core/target/pit-reports \
            -DtimeoutFactor=2.0 \
            -Dthreads=1 \
            -Dverbose=true \
            -DtargetClasses=com.graphhopper.util.DistanceCalcEuclidean \
            -DtargetTests=com.graphhopper.util.DistanceCalcEuclideanTest \
            -Dmutators=ALL \
            -DfailWhenNoMutations=true \
            -DoutputFormats=CSV,HTML \
            org.pitest:pitest-maven:mutationCoverage

      - name: Compute mutation score from mutations.csv
        run: |
          set -e
          mkdir -p pit-current

          FILE=$(find core -name "mutations.csv" | head -n 1)
          echo "Found mutations.csv at: $FILE"

          if [ ! -f "$FILE" ]; then
            echo "::warning::mutations.csv not found"
            echo "TOTAL=0" > pit-current/pit-score.txt
            echo "KILLED=0" >> pit-current/pit-score.txt
            echo "LINE_COVERAGE=0.00" >> pit-current/pit-score.txt
            cat pit-current/pit-score.txt
            exit 0
          fi

          cp "$FILE" pit-current/mutations.csv
          TOTAL=$(tail -n +2 pit-current/mutations.csv | wc -l | tr -d ' ')
          KILLED=$(grep -c ',KILLED,' pit-current/mutations.csv || true)
          echo "TOTAL=$TOTAL" > pit-current/pit-score.txt
          echo "KILLED=$KILLED" >> pit-current/pit-score.txt
          if [ "$TOTAL" -gt 0 ]; then
            awk -v k="$KILLED" -v t="$TOTAL" 'BEGIN{printf("LINE_COVERAGE=%.2f\n",(k/t)*100)}' >> pit-current/pit-score.txt
          else
            echo "LINE_COVERAGE=0.00" >> pit-current/pit-score.txt
          fi
          cat pit-current/pit-score.txt

      - name: Compare mutation score with previous
        run: |
          NEW_SCORE=$(grep LINE_COVERAGE pit-current/pit-score.txt | cut -d '=' -f 2)
          OLD_SCORE=$(grep LINE_COVERAGE pit-previous/pit-score.txt | cut -d '=' -f 2 || echo "0.00")

          echo "Previous score: $OLD_SCORE%"
          echo "Current score:  $NEW_SCORE%"

          awk -v new="$NEW_SCORE" -v old="$OLD_SCORE" 'BEGIN {
            if (new < old) {
              print "::error::Mutation score dropped from " old "% to " new "%"
              exit 1
            } else {
              print "✅ Mutation score is stable or improved."
              exit 0
            }
          }'

      - name: Upload mutation score
        uses: actions/upload-artifact@v4
        with:
          name: pit-score
          path: pit-current/pit-score.txt

      - name: Upload PIT report
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: core/target/pit-reports
